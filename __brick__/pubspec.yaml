name: { { project_name } }
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  flutter_dotenv: ^6.0.1
  sentry_flutter: ^9.30.0
  crypto: ^3.0.7
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  dio: ^5.11.1
  logging: ^1.3.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/initial_data.json
