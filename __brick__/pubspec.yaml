name: {{project_name}}
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  flutter_dotenv: ^6.0.1
  sentry_flutter: ^9.30.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/initial_data.json
